# Deterministic CPU-only nonconvex-instability experiments.
#
# Target:
#   V_R(x) = 0.5*x^2 - 2*R^2*log(cosh(x/R))
#   -1 <= V_R'' <= 1, but the target is non-log-concave.

gh_nodes: 160
output_dir: outputs/natural_gradient_nonconvex_instability

riemannian_cascade:
  R_values: [20, 50, 100, 300, 1000]
  dt: 1.0
  c0: 1.0
  max_iter: 20
  stop_fraction: 0.25      # stop when c > R^2 / 4
  max_log_c: 700.0

kl_pole:
  R: 1000
  dt: 1.0
  c0_rule: 1_minus_epsilon
  epsilons: [1.0e-1, 1.0e-2, 1.0e-3, 1.0e-4, 1.0e-5, 1.0e-6]
  max_iter: 2

wasserstein_fb:
  R_values: [20, 50, 100, 300, 1000]
  eta: 0.9
  c0: 1.0
  max_iter: 20000

# Projected KL scheme with covariance clipping. The current projected-KL theorem
# uses the Bregman smoothness constant L_clip = 2*beta*lambda_plus and the
# theorem-safe stepsize dt = safety / L_clip = safety / (2*beta*lambda_plus),
# safety <= 1. The theorem-safe scale depends on lambda_plus and beta only, not
# on lambda_minus.
clipped_kl_stationarity:
  R_values: [20, 50, 100, 300, 1000]
  lambda_minus: 0.5
  lambda_plus: 2.0
  beta: 1.0
  dt_safety: 0.5            # primary safety used by the report figures
  safety_values: [0.25, 0.5, 0.9]
  c0: 1.0
  num_steps: 300
  # Also run dt = 1/(beta*lambda_plus) = 2x the theorem edge 1/(2*beta*lambda_plus),
  # so dt*L_clip = 2: outside the theorem. The study asks whether the stationarity
  # envelope still follows empirically (it does, via single-step boundary clip).
  compare_outside_theorem_2x: true
  # Theory-only sweep showing dt_theory is independent of lambda_minus and scales
  # like 1/lambda_plus.
  theory_sweep:
    lambda_minus_values: [0.1, 0.25, 0.5, 1.0]
    lambda_plus_values: [1.0, 2.0, 4.0, 8.0]

optimizer:
  maxiter: 300
  gtol: 1.0e-10

smoke:
  gh_nodes: 48
  output_dir: outputs/natural_gradient_nonconvex_instability_smoke
  riemannian_cascade:
    R_values: [20, 1000]
    dt: 1.0
    c0: 1.0
    max_iter: 5
    stop_fraction: 0.25
    max_log_c: 700.0
  kl_pole:
    R: 1000
    dt: 1.0
    c0_rule: 1_minus_epsilon
    epsilons: [1.0e-1, 1.0e-3]
    max_iter: 1
  wasserstein_fb:
    R_values: [20]
    eta: 0.9
    c0: 1.0
    max_iter: 50
  clipped_kl_stationarity:
    R_values: [20, 1000]
    lambda_minus: 0.5
    lambda_plus: 2.0
    beta: 1.0
    dt_safety: 0.5
    safety_values: [0.25, 0.5, 0.9]
    c0: 1.0
    num_steps: 30
    compare_outside_theorem_2x: true
    theory_sweep:
      lambda_minus_values: [0.25, 0.5, 1.0]
      lambda_plus_values: [1.0, 2.0, 4.0]
  optimizer:
    maxiter: 80
    gtol: 1.0e-8

